name: Store deals

# Daily, before the import: each store's own cart says what 1, 2 and 3 of a product cost, so multi-buys and free
# gifts the store applies by itself show beside its price (scripts/promos.ts, src/lib/promos.ts) →
# data/public/promos.json, committed WITHOUT [deploy] (it rides the import's release). Eight runners, one store at a
# time each. On a claude/* branch that changes the script it runs too and commits to that branch, so a change is
# checked against real stores before it lands.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["scripts/promos.ts", "src/lib/promos.ts", ".github/workflows/promos.yml"]

concurrency:
  group: store-deals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/promos.ts
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promos-${{ matrix.shard }}
          path: promos-out-${{ matrix.shard }}.json
          if-no-files-found: ignore

  commit:
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - run: npx tsx scripts/promos.ts --merge shards
      - name: Commit deals
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/promos.json
          git diff --cached --quiet && exit 0
          git commit -m "data: store deals $(date -u +%F)" -m "Written by promos.yml. No deploy marker: it rides the next daily release."
          for i in 1 2 3 4; do
            git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            sleep $((2 ** i)); git pull --rebase origin ${GITHUB_REF_NAME}
          done
          exit 1
